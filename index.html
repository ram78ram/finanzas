<!-- Script para Google Apps Script (se copia desde Ajustes). No se ejecuta en esta p√°gina. -->
<script type="text/plain" id="gscode">/**
 * Mis Finanzas ‚Äì lector de alertas de BBVA en Gmail
 * Pega este c√≥digo en la hoja "Mis Finanzas ‚Äì datos" (Extensiones ‚Üí Apps Script),
 * guarda, elige la funci√≥n "instalar" y presiona Ejecutar. Autoriza con tu cuenta.
 * Desde ah√≠ revisa tu Gmail cada 5 minutos y deja los cargos en la pesta√±a "Correos";
 * la app los toma al sincronizar y te los muestra en "Por categorizar".
 */
const CONFIG = {
  // Si tus alertas llegan de otro remitente, c√°mbialo aqu√≠ (ej. 'from:notificaciones@bbva.mx').
  BUSQUEDA: 'from:bbva newer_than:7d',
  ETIQUETA: 'Finanzas-registrado',
  HOJA: 'Correos',
  // Solo se registran correos que hablen de un movimiento (evita promociones).
  PALABRAS: /compra|cargo|retiro|transfer|pago|pagaste|dep[o√≥]sito|abono|recibiste|domicilia|SPEI|disposici[o√≥]n/i
};

function onOpen() {
  SpreadsheetApp.getUi().createMenu('üí∞ Finanzas')
    .addItem('Revisar correos ahora', 'revisarCorreos')
    .addItem('Instalar revisi√≥n autom√°tica', 'instalar')
    .addToUi();
}

function instalar() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'revisarCorreos') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('revisarCorreos').timeBased().everyMinutes(5).create();
  revisarCorreos();
}

function revisarCorreos() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const hoja = ss.getSheetByName(CONFIG.HOJA) || ss.insertSheet(CONFIG.HOJA);
  if (hoja.getLastRow() === 0) hoja.appendRow(['id', 'fecha', 'texto', 'de', 'asunto']);
  const n = hoja.getLastRow();
  const ids = new Set(n > 1 ? hoja.getRange(2, 1, n - 1, 1).getValues().map(function (r) { return String(r[0]); }) : []);
  const etiqueta = GmailApp.getUserLabelByName(CONFIG.ETIQUETA) || GmailApp.createLabel(CONFIG.ETIQUETA);
  const hilos = GmailApp.search(CONFIG.BUSQUEDA + ' -label:' + CONFIG.ETIQUETA, 0, 50);
  const tz = Session.getScriptTimeZone();
  const filas = [];
  hilos.forEach(function (hilo) {
    hilo.getMessages().forEach(function (m) {
      const id = m.getId();
      if (ids.has(id)) return;
      const texto = extraer(m.getPlainBody() || m.getBody());
      if (!texto || !CONFIG.PALABRAS.test(texto + ' ' + m.getSubject())) return;
      filas.push([id, Utilities.formatDate(m.getDate(), tz, 'yyyy-MM-dd'), texto, m.getFrom(), m.getSubject()]);
      ids.add(id);
    });
    hilo.addLabel(etiqueta);
  });
  if (filas.length) {
    hoja.getRange(hoja.getLastRow() + 1, 1, filas.length, 5).setNumberFormat('@').setValues(filas);
  }
}

// Devuelve la frase del correo que contiene el monto (ej. "Compra aprobada por $350.00 en WALMART con tu tarjeta *1234").
function extraer(cuerpo) {
  const t = String(cuerpo)
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#36;/g, '$')
    .replace(/\s+/g, ' ').trim();
  const i = t.search(/\$\s?\d/);
  if (i < 0) return '';
  const antes = t.slice(Math.max(0, i - 180), i);
  const corte = Math.max(antes.lastIndexOf('. '), antes.lastIndexOf(': '));
  const ini = corte >= 0 ? antes.slice(corte + 2) : antes;
  const despues = t.slice(i, i + 240);
  const fin = despues.slice(4).search(/\.\s|\s{2}|$/);
  return (ini + despues.slice(0, fin + 4)).trim();
}

function mesLabel(ym){const[y,m]=ym.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'short',year:'numeric'}).replace('.','');return s.charAt(0).toUpperCase()+s.slice(1)}
function dayLabel(d){const t=today(),y=new Date();y.setDate(y.getDate()-1);if(d===t)return'Hoy';if(d===dstr(y))return'Ayer';const[a,b,c]=d.split('-').map(Number);const s=new Date(a,b-1,c).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});return s.charAt(0).toUpperCase()+s.slice(1)}
function ago(ts){if(!ts)return'nunca';const s=(Date.now()-ts)/1000;if(s<60)return'hace un momento';if(s<3600)return`hace ${Math.round(s/60)} min`;if(s<86400)return`hace ${Math.round(s/3600)} h`;return new Date(ts).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

/* ---------- Parseo de notificaciones BBVA ---------- */
function parseBank(txt){
  const s=String(txt).replace(/\s+/g,' ').trim(), n=norm(s);
  let monto=0;
  let m=s.match(/\$\s?([\d,]+(?:\.\d{1,2})?)/)||s.match(/(?:MXN|MN)\s?([\d,]+(?:\.\d{1,2})?)/i)||s.match(/\bpor\s+([\d,]+\.\d{2})/i);
  if(m)monto=money(m[1]);
  let tarjeta='';const tm=s.match(/(?:\*|‚Ä¢|terminaci[o√≥]n\s*|termina(?:da)?\s+en\s*)(\d{4})/i);if(tm)tarjeta=tm[1];
  let comercio='';
  const cm=s.match(/\ben\s+(?!l[ao]s?\s+(?:cuenta|tarjeta)\b)(?!tu\b)(?!su\b)([A-Za-z0-9√Å√â√ç√ì√ö√ë√°√©√≠√≥√∫√±*&.'\- ]{2,40}?)(?=\s+(?:con|por|el|del|a\s+las|tarjeta|fue|ha|por\s+un)\b|\s*[,.;]\s|\s*\$|\s*$)/i)
        ||s.match(/\ba\s+([A-Z√Å√â√ç√ì√ö√ë][A-Za-z0-9√Å√â√ç√ì√ö√ë√°√©√≠√≥√∫√±.&' ]{2,40}?)(?=\s+(?:con|por|el|desde)\b|\s*[,.;]|\s*$)/);
  if(cm)comercio=cm[1].trim().replace(/[.*]+$/,'');
  let tipo='gasto';
  if(/recibiste|deposito|abono a tu cuenta|te (?:enviaron|transfirieron|depositaron)|ingreso|nomina/.test(n))tipo='ingreso';
  else if(/pago de servicio|pagaste|pago a tu tarjeta|domiciliad|pago de tarjeta/.test(n))tipo='pago';
  return{monto,comercio,tarjeta,tipo};
}
function newPend(raw,extra={}){
  const p=parseBank(raw);if(!p.monto)return null;
  return{id:uid(),raw,fecha:today(),...p,cat:guessCat(p.comercio+' '+raw,p.tipo),upd:Date.now(),...extra};
}
function addPending(text){
  const lines=String(text).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const withAmt=lines.filter(l=>/\$|MXN/i.test(l));
  const chunks=withAmt.length>1?withAmt:[lines.join(' ')];
  let added=0,dup=0;
  for(const raw of chunks){
    if(S.pend.some(p=>p.raw===raw)||S.movs.some(m=>m.raw===raw)){dup++;continue}
    const p=newPend(raw);if(p){S.pend.unshift(p);added++}
  }
  save();
  if(added)toast(`‚úÖ ${added} movimiento${added>1?'s':''} detectado${added>1?'s':''}. Elige en qu√© se gast√≥.`);else if(dup)toast('Esa notificaci√≥n ya estaba registrada');else toast('No encontr√© un monto en el texto');
  return added;
}

/* ---------- Parseo de voz ---------- */
function parseAmount(t){
  t=t.replace(/(\d),(\d{3})/g,'$1$2').replace(/\$/g,' ');
  let m=t.match(/(\d+(?:\.\d+)?)\s*mil(?:\s*(?:y\s*)?(\d+(?:\.\d+)?))?/);
  if(m)return{monto:parseFloat(m[1])*1000+(m[2]?parseFloat(m[2]):0),rest:t.replace(m[0],' ')};
  m=t.match(/\bmil(?:\s*(?:y\s*)?(\d+(?:\.\d+)?))?\b/);
  if(m)return{monto:1000+(m[1]?parseFloat(m[1]):0),rest:t.replace(m[0],' ')};
  m=t.match(/\d+(?:\.\d+)?/);
  if(m)return{monto:parseFloat(m[0]),rest:t.replace(m[0],' ')};
  return{monto:0,rest:t};
}
function cleanNote(s){return s.replace(/\b(pesos?|varos|mxn|hoy|ayer|por favor)\b/g,' ').replace(/^\s*(el|la|los|las|un|una|unos|unas|al|del|mi|mis)\s+/,'').replace(/\s+/g,' ').trim()}
function parseVoice(raw){
  const t=norm(raw);const{monto,rest}=parseAmount(t);
  const y=new Date();y.setDate(y.getDate()-1);const fecha=/\bayer\b/.test(t)?dstr(y):today();
  const loanHit=live(S.prest).find(p=>p.persona&&new RegExp('\\b'+norm(p.persona).split(' ')[0]+'\\b').test(t));
  if(/\babon/.test(t)||(loanHit&&/\b(le )?pague (a|al)\b/.test(t))){
    let persona=loanHit?loanHit.persona:'';
    if(!persona){const pm=rest.match(/\b(?:a|al prestamo de|de)\s+([a-zn ]+?)\s*$/);if(pm)persona=cap(cleanNote(pm[1]))}
    return{kind:'abono',monto,fecha,prest:loanHit?loanHit.id:'',persona};
  }
  if(/me prest|prestamo/.test(t)){
    let persona='';let pm=t.match(/^(?:mi\s+|el\s+|la\s+)?(.+?)\s+me\s+presto/);
    if(pm)persona=pm[1];else{pm=rest.match(/\b(?:de|con)\s+([a-zn ]+?)(?:\s+(?:por|de|para)\b|\s*$)/);if(pm)persona=pm[1]}
    persona=cleanNote(persona.replace(/\d|\bmil\b|pesos?/g,''));
    const pw=persona.split(' ');persona=cap(pw.map(w=>String(raw).split(/\s+/).find(r=>norm(r).replace(/[^a-z]/g,'')===w)||w).join(' '));
    const nm=rest.match(/\bpara\s+(.+)$/);
    return{kind:'prestamo',monto,fecha,persona,nota:nm?cleanNote(nm[1]):''};
  }
  let tipo='gasto';
  if(/\b(recibi|me pagaron|me depositaron|me transfirieron|ingreso|cobre|gane|sueldo|quincena|nomina|vendi)\b/.test(t))tipo='ingreso';
  else if(/\b(pague|pago|pagar|liquide)\b/.test(t))tipo='pago';
  const nm=rest.match(/\b(?:en|de|para|por)\s+(.+)$/);
  const nota=cleanNote(nm?nm[1]:rest.replace(/\b(gaste|gasto|pague|pago|compre|recibi|me|pagaron|depositaron|registra|registrar|anota|ingreso|de|en)\b/g,' '));
  return{kind:'mov',tipo,monto,fecha,nota:nota?nota.charAt(0).toUpperCase()+nota.slice(1):'',cat:guessCat(t,tipo)};
}
function handleVoice(raw){
  raw=String(raw||'').trim();if(!raw)return;
  const r=parseVoice(raw);const said=`<p class="said">‚Äú${esc(raw)}‚Äù</p>`;
  if(r.kind==='prestamo'){openSheet(prestForm({persona:r.persona,monto:r.monto||'',fecha:r.fecha,nota:r.nota},said));speak(`Pr√©stamo de ${r.persona||'alguien'} por ${r.monto||'monto pendiente'} pesos. ¬øLo guardo?`)}

/* ---------- Reconocimiento de voz ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function stopRec(){try{rec&&rec.abort()}catch(e){}rec=null}
function startRec(){
  const box=$('#listen'),inp=$('#vozt'),msg=$('#lmsg');if(!box)return;
  if(!SR){msg.textContent='Tu navegador no soporta dictado aqu√≠. Usa el micr√≥fono del teclado y escribe abajo.';return}
  stopRec();rec=new SR();rec.lang='es-MX';rec.interimResults=true;rec.maxAlternatives=1;let fin='';
  rec.onstart=()=>{box.classList.add('on');msg.textContent='Escuchando‚Ä¶ habla ahora'};
  rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}inp.value=(fin+it).trim()};
  rec.onerror=e=>{box.classList.remove('on');msg.textContent=e.error==='not-allowed'?'Permiso de micr√≥fono denegado. Act√≠valo en el navegador (requiere https).':'No te escuch√©. Toca el micr√≥fono para intentar de nuevo.'};
  rec.onend=()=>{box&&box.classList.remove('on');const v=fin.trim();rec=null;if(v)handleVoice(v);else if(msg.textContent.startsWith('Escuchando'))msg.textContent='Toca el micr√≥fono para hablar'};
  try{rec.start()}catch(e){msg.textContent='No se pudo iniciar el micr√≥fono'}
}

/* =====================================================================
   Sincronizaci√≥n con Google (Hoja de c√°lculo en tu Drive)
   - Inicias sesi√≥n con Google (permiso "drive.file": la app solo ve los
     archivos que ella misma crea, no el resto de tu Drive).
   - Los datos viven en la hoja "Mis Finanzas ‚Äì datos".
   - Cada registro tiene id + fecha de cambio (upd); gana el m√°s reciente.
     Lo borrado se marca (del=1) para que tambi√©n se borre en el otro equipo.
   ===================================================================== */
const SCOPE='https://www.googleapis.com/auth/drive.file';
const SHEET_TITLE='Mis Finanzas ‚Äì datos';
const TABS={
  Movimientos:['movs',['id','fecha','tipo','monto','cat','nota','origen','src','raw','upd','del']],
  Prestamos:['prest',['id','fecha','persona','monto','nota','upd','del']],
  Abonos:['abonos',['id','prestId','fecha','monto','nota','upd','del']],
  Pendientes:['pend',['id','fecha','tipo','monto','comercio','tarjeta','cat','origen','raw','upd','del']]
};
const MAILCOLS=['id','fecha','texto','de','asunto'];
const CFGK='misfinanzas.cfg',TOKK='misfinanzas.tok';
let CFG=loadJ(CFGK)||{};let TOK=loadJ(TOKK);
const tokOk=()=>!!(TOK&&TOK.t&&TOK.exp>Date.now()+60000);
let syncState='off',syncMsg='',syncing=false,again=false,syncT=null;

let gisP=null;
function loadGis(){return gisP||(gisP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=res;s.onerror=()=>{gisP=null;rej(new Error('No se pudo cargar el inicio de sesi√≥n de Google. ¬øHay internet?'))};document.head.appendChild(s)}))}
let tc=null,tcCid='',authRes=null,authRej=null;
// Debe llamarse directo desde un toque del usuario (el navegador bloquea ventanas emergentes si no).
function login(){
  if(!CFG.clientId)return Promise.reject(new Error('Falta el Client ID de Google'));
  if(!(window.google&&google.accounts&&google.accounts.oauth2))return loadGis().then(()=>login());
  if(!tc||tcCid!==CFG.clientId){
    tc=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:SCOPE,
      callback:r=>{if(r.error){authRej&&authRej(new Error(r.error_description||r.error));return}TOK={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};saveJ(TOKK,TOK);authRes&&authRes()},
      error_callback:e=>authRej&&authRej(new Error(e&&e.type==='popup_closed'?'Se cerr√≥ la ventana de Google':e&&e.type==='popup_failed_to_open'?'El navegador bloque√≥ la ventana de Google':'No se pudo iniciar sesi√≥n'))});
    tcCid=CFG.clientId;
  }
  return new Promise((res,rej)=>{authRes=res;authRej=rej;tc.requestAccessToken({prompt:''})});
}
async function api(url,opts={}){
  if(!tokOk())throw Object.assign(new Error('Inicia sesi√≥n con Google'),{auth:true});
  const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+TOK.t,...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401){TOK=null;saveJ(TOKK,null);throw Object.assign(new Error('La sesi√≥n de Google expir√≥'),{auth:true})}
  if(r.status===404)throw Object.assign(new Error('No encontr√© la hoja de datos'),{notFound:true});
  if(!r.ok){let m='Error '+r.status;try{const j=await r.json();m=(j.error&&j.error.message)||m}catch(e){}throw new Error(m)}
  return r.status===204?null:r.json();
}
const SHEETS='https://sheets.googleapis.com/v4/spreadsheets';
async function ensureSheet(){
  if(CFG.sheetId)return CFG.sheetId;
  const q=encodeURIComponent("appProperties has { key='misfinanzas' and value='datos' } and trashed=false");
  const f=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=createdTime&spaces=drive`);
  if(f.files&&f.files.length){CFG.sheetId=f.files[0].id}
  else{
    const ss=await api(SHEETS,{method:'POST',body:JSON.stringify({properties:{title:SHEET_TITLE,locale:'es_MX'},sheets:[...Object.keys(TABS),'Correos'].map(t=>({properties:{title:t}}))})});
    CFG.sheetId=ss.spreadsheetId;
    await api(`https://www.googleapis.com/drive/v3/files/${CFG.sheetId}`,{method:'PATCH',body:JSON.stringify({appProperties:{misfinanzas:'datos'}})});
    await api(`${SHEETS}/${CFG.sheetId}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:[...Object.entries(TABS).map(([t,[,c]])=>({range:t+'!A1',values:[c]})),{range:'Correos!A1',values:[MAILCOLS]}]})});
  }
  saveJ(CFGK,CFG);return CFG.sheetId;
}
function serialToISO(n){return dstr(new Date(Math.round((n-25569)*864e5)+new Date().getTimezoneOffset()*6e4))}
function fromRow(r,hdr){
  const o={};hdr.forEach((h,i)=>{const v=r[i];if(v!==''&&v!=null)o[h]=v});
  o.id=String(o.id||'');
  if(o.monto!=null)o.monto=+o.monto||0;
  o.upd=+o.upd||0;o.del=!!o.del&&o.del!=='0';
  if(typeof o.fecha==='number')o.fecha=serialToISO(o.fecha);else if(o.fecha)o.fecha=String(o.fecha).slice(0,10);
  for(const k of ['nota','raw','persona','comercio','cat','tarjeta','prestId','src','origen','tipo','texto'])if(o[k]!=null)o[k]=String(o[k]);
  return o;
}
function cell(o,c){const v=o[c];if(c==='del')return v?1:'';return v==null?'':v}
function mergeArr(local,remote){
  const m=new Map(local.map(x=>[x.id,x]));
  for(const r of remote){const l=m.get(r.id);if(!l||(r.upd||0)>(l.upd||0))m.set(r.id,r)}
  return [...m.values()];
}
function importMail(rows){
  const hdr=rows[0]&&rows[0].length?rows[0].map(String):MAILCOLS;let n=0;
  for(const r of rows.slice(1)){
    const o=fromRow(r,hdr);if(!o.id||!o.texto)continue;
    const pid='g_'+o.id;
    if(S.pend.some(p=>p.id===pid)||S.movs.some(m=>m.src===pid))continue;
    const p=newPend(o.texto,{id:pid,fecha:o.fecha||today(),origen:'gmail'});
    if(p){S.pend.push(p);n++}
  }
  return n;
}
async function sync(interactive){
  if(!CFG.clientId){if(interactive)openSettings();return}
  if(syncing){again=true;return}
  syncing=true;setSync('busy');
  try{
    if(!tokOk()){if(!interactive)throw Object.assign(new Error('Toca ‚òÅÔ∏è para iniciar sesi√≥n'),{auth:true});await login()}
    const id=await ensureSheet();
    const names=[...Object.keys(TABS),'Correos'];
    const rd=await api(`${SHEETS}/${id}/values:batchGet?${names.map(n=>'ranges='+encodeURIComponent(n+'!A:Z')).join('&')}&valueRenderOption=UNFORMATTED_VALUE`);
    const vr=rd.valueRanges||[],prevLen={};
    Object.entries(TABS).forEach(([t,[k,cols]],i)=>{
      const rows=(vr[i]&&vr[i].values)||[];prevLen[t]=rows.length;
      const hdr=rows[0]&&rows[0].length?rows[0].map(String):cols;
      S[k]=mergeArr(S[k],rows.slice(1).map(r=>fromRow(r,hdr)).filter(o=>o.id));
    });
    const nm=importMail((vr[names.length-1]&&vr[names.length-1].values)||[]);
    const data=Object.entries(TABS).map(([t,[k,cols]])=>{
      const out=S[k].map(o=>cols.map(c=>cell(o,c)));
      while(out.length+1<prevLen[t])out.push(cols.map(()=>''));
      return{range:t+'!A1',values:[cols,...out]};
    });
    await api(`${SHEETS}/${id}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});
    CFG.lastSync=Date.now();saveJ(CFGK,CFG);store();render();setSync('ok');
    if(nm)toast(`üìß ${nm} cargo${nm>1?'s':''} nuevo${nm>1?'s':''} de tus correos`);else if(interactive)toast('‚òÅÔ∏è Sincronizado');
  }catch(e){
    if(e.auth)setSync('auth',e.message);
    else if(e.notFound){CFG.sheetId='';saveJ(CFGK,CFG);setSync('err','No encontr√© la hoja (¬øla borraste?). Toca ‚òÅÔ∏è para crear o buscar otra.')}
    else setSync('err',e.message);
    if(interactive)toast('‚ö†Ô∏è '+e.message);
  }finally{syncing=false;if(again){again=false;setTimeout(()=>sync(false),400)}}
}
function syncSoon(){
  if(!CFG.sheetId)return;
  if(!tokOk()){setSync('auth','Toca ‚òÅÔ∏è para iniciar sesi√≥n y sincronizar');return}

}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const f=A[el.dataset.action];if(f){e.preventDefault();f(el.dataset)}});
document.addEventListener('change',e=>{
  if(e.target.name==='tipo'&&e.target.form&&e.target.form.dataset.form==='mov'){const fm=e.target.form;fm.cat.innerHTML=catOptions(e.target.value,guessCat(fm.nota.value,e.target.value))}
});
$('#impf').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.movs))throw 0;if(confirm('Esto agrega el respaldo a tus datos actuales (si un registro existe en ambos, gana el m√°s reciente). ¬øContinuar?')){const t=Date.now();
  const inc={movs:d.movs||[],prest:d.prest||[],abonos:d.abonos||[],pend:d.pend||[]};inc.prest.forEach(p=>{if(Array.isArray(p.abonos)){p.abonos.forEach(a=>inc.abonos.push({...a,prestId:p.id}));delete p.abonos}});
  for(const k of Object.keys(inc)){inc[k].forEach(o=>{if(!o.upd)o.upd=t});S[k]=mergeArr(S[k],inc[k])}
  save();toast('Respaldo importado')}}catch(err){toast('Archivo no v√°lido')}e.target.value=''});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f));
  if(f.dataset.form==='voz'){stopRec();return handleVoice(fd.t)}
  const monto=money(fd.monto);if(!(monto>0))return toast('Escribe un monto v√°lido');
  if(f.dataset.form==='mov'){
    const m={tipo:fd.tipo,monto,cat:fd.cat,nota:fd.nota.trim(),fecha:fd.fecha||today(),origen:fd.origen,upd:Date.now()};
    if(fd.pend){const p=S.pend.find(x=>x.id===fd.pend);if(p){m.src=p.id;m.raw=p.raw;p.del=true;touch(p)}}
    const ex=fd.id&&S.movs.find(x=>x.id===fd.id);
    if(ex)Object.assign(ex,m);else S.movs.push({id:uid(),...m});
    closeSheet();save();toast(`${LBL[m.tipo]} de ${fmt(monto)} guardado`);
  }else if(f.dataset.form==='prest'){
    const p={persona:cap(fd.persona),monto,fecha:fd.fecha||today(),nota:fd.nota.trim(),upd:Date.now()};
    const ex=fd.id&&S.prest.find(x=>x.id===fd.id);
    if(ex)Object.assign(ex,p);else S.prest.push({id:uid(),...p});
    closeSheet();view='prest';save();toast('Pr√©stamo guardado');
  }else if(f.dataset.form==='abono'){
    const p=S.prest.find(x=>x.id===fd.pid&&!x.del);if(!p)return toast('Elige un pr√©stamo');
    const r=restante(p);S.abonos.push({id:uid(),prestId:p.id,monto,fecha:fd.fecha||today(),nota:fd.nota.trim(),upd:Date.now()});
    view='prest';save();const nr=restante(p);
    toast(monto>r&&r>0?`Ojo: abonaste ${fmt(monto-r)} de m√°s`:nr?`Abono guardado. Te faltan ${fmt(nr)}`:'üéâ ¬°Pr√©stamo liquidado!');
    prestDetail(p.id);
  }
});

/* ---------- Arranque ---------- */
(function(){
  const q=new URLSearchParams(location.search);const t=q.get('bbva')||q.get('n');const v=q.get('voz');
  if(t||v)history.replaceState(null,'',location.pathname);
  store();render();setSync(CFG.sheetId?(tokOk()?'ok':'auth'):'off');
  if(t){view='banco';addPending(t)}
  if(v)handleVoice(v);
  if(CFG.clientId)loadGis().catch(()=>{});
  if(CFG.sheetId&&tokOk())sync(false);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CFG.sheetId&&tokOk())sync(false)});
  addEventListener('online',()=>{if(CFG.sheetId&&tokOk())sync(false)});
})();
</script>
